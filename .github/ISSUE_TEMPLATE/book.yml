name: Suggest a book
description: Leave a reading recommendation for Kaustubh's bookshelf.
title: "Suggest a book for the bookshelf"
body:
  - type: input
    id: book
    attributes:
      label: Book title
      description: Enter one title, up to 120 characters.
      placeholder: The End of Everything (Astrophysically Speaking)
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Book author
      description: Optional. Up to 90 characters.
      placeholder: Katie Mack
  - type: checkboxes
    id: consent
    attributes:
      label: Bookshelf credit
      options:
        - label: List my suggestion and GitHub username on the public profile.
          required: true
