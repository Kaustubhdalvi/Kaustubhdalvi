name: Feed & Play
description: Request the next free visit to Pip’s yard.
title: "Record a feed & play visit"
body:
  - type: markdown
    attributes:
      value: |
        One free visit is shared by everyone every 12 hours. GitHub uses the submission time to award the first eligible request. After submitting, follow the yard link in your issue. Refresh the profile once GitHub records your visit to see the puppies greet you for one minute.

        If another visitor gets there first, **Feed & Play** in the yard shows when the next free visit opens.
  - type: checkboxes
    id: credit
    attributes:
      label: Feeding credit
      options:
        - label: "Credit my GitHub username for this visit to [Pip’s yard](https://github.com/Kaustubhdalvi#pips-yard)."
          required: true
