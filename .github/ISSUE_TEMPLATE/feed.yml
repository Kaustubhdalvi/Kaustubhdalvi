name: Feed & Play
description: Request the next free visit to Pip’s yard.
title: "Record a feed & play visit"
body:
  - type: markdown
    attributes:
      value: |
        One free bowl is shared every 12 hours. Submit this issue to request credit under your signed-in GitHub username. The first eligible submission earns a leaderboard point.

        Return to your yard tab to continue the animation. If you closed it, [replay the one-minute visit](https://kaustubhdalvi.github.io/Kaustubhdalvi/feed-and-play.html?replay=1).
  - type: checkboxes
    id: credit
    attributes:
      label: Feeding credit
      options:
        - label: "Credit my GitHub username for this visit to [Pip’s yard](https://github.com/Kaustubhdalvi#pips-yard)."
          required: true
