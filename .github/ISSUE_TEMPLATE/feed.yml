name: Feed & Play
description: Request the next free visit to Pip’s yard.
title: "Record a feed & play visit"
body:
  - type: markdown
    attributes:
      value: |
        Everyone shares one free bowl every 12 hours. The first eligible request earns one leaderboard point under your GitHub username.

        [Return to Pip’s yard to play the one-minute visit.](https://github.com/Kaustubhdalvi#pips-yard)
  - type: checkboxes
    id: credit
    attributes:
      label: Feeding credit
      options:
        - label: "Credit my GitHub username for this visit to [Pip’s yard](https://github.com/Kaustubhdalvi#pips-yard)."
          required: true
