name: Feed & Play
description: Request the next free visit to Pip’s yard.
title: "Record a feed & play visit"
body:
  - type: markdown
    attributes:
      value: |
        One free visit is shared by everyone every 12 hours. GitHub uses the submission time to award the first eligible request. The puppies meet their visitor for one minute in [Pip’s yard](https://github.com/Kaustubhdalvi#pips-yard).
  - type: checkboxes
    id: credit
    attributes:
      label: Feeding credit
      options:
        - label: List my GitHub username on the garden leaderboard for this visit.
          required: true
