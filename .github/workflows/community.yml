name: Update the garden and bookshelf

on:
  issues:
    types: [opened, edited, deleted, transferred]
  discussion_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  discussions: read

concurrency:
  group: profile-garden-reconciliation
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Refresh the guestbook, yard and bookshelf
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --no-tags origin "refs/heads/$PROFILE_BRANCH"
            git checkout -B community-update FETCH_HEAD
            installed=$(git log -1 --diff-filter=A --format=%cI -- .github/garden-ledger.json)
            test -n "$installed"
            python3 scripts/community.py --garden --installed-at "$installed"
            git add -- README.md assets/yard-guest-sign.svg garden/last-feeding.json .github/garden-ledger.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh the profile guestbook and bookshelf'
            if git push origin "HEAD:refs/heads/$PROFILE_BRANCH"; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep "$((attempt * 2))"
          done
