<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 28" width="700" height="28" aria-hidden="true">
<style>
@keyframes tide{to{transform:translateX(-224px)}}
@keyframes undertow{from{transform:translateX(-224px)}to{transform:translateX(0)}}
