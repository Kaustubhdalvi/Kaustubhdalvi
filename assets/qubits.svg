<svg xmlns="http://www.w3.org/2000/svg" width="640" height="136" viewBox="0 0 640 136" role="img" aria-labelledby="title desc">
<title id="title">Measure a Bell pair after a possible phase flip</title>
<desc id="desc">The top wire optionally passes through Z in one quarter of trials. Both wires then pass through H and are measured in the computational basis.</desc>
