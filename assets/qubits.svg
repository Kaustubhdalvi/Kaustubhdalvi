<rect width="640" height="136" rx="12" fill="#101926"/><rect x=".5" y=".5" width="639" height="135" rx="12" fill="url(#grain)" stroke="#364457"/>
<path d="M13 23V13h10m594 0h10v10M13 113v10h10m594 0h10v-10" fill="none" stroke="#546270" stroke-width="1.1"/>
